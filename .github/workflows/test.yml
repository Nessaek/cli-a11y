name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Both platforms, because the pty behaves differently on each: a closed
    # pty reads as EOF on macOS and EIO on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.24', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...
